[project]
name = "memory-demo"
version = "0.1.0"
description = "Cognee-backed memory demo with a Streamlit UI for itinerary planning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cognee==1.6.10",
    "cognee-community-vector-adapter-qdrant",
    "openai==3.57.0",
    "fastapi==0.165.0",
    "fastapi-users==15.0.5",
    "fastapi-users-db-sqlalchemy==7.0.0",
    "streamlit==1.67.0",
    "python-dotenv==1.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["cloud", "custom_app", "inference", "ui"]
